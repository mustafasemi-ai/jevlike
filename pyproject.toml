[project]
name = "jevlike"
version = "0.1.0"
description = "Tek forward pass'te tipli, kalibre kararlar veren System One tarzi model"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.7.0",
    "transformers>=4.51.0",
    "peft>=0.14.0",
    "datasets>=3.2.0",
    "accelerate>=1.3.0",
    "safetensors>=0.5.0",
    "numpy>=2.0",
    "scipy>=1.14",
    "pydantic>=2.10",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "tqdm>=4.67",
    "orjson>=3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jevlike"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "catboost>=1.2.10",
    "lightgbm>=4.7.0",
    "matplotlib>=3.9",
    "scikit-learn>=1.9.1",
    "tabpfn>=9.0.0",
    "xgboost>=3.4.1",
]
